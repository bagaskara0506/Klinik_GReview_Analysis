name: Scrape Google Review Klinik Kita
# tes
on:
  schedule:
    # Jadwal otomatis setiap hari pukul 15:30 UTC = 22:30 WIB
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'devel' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Google Maps Scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python src/scrape_klinik_kita.py

      - name: Upload & Sync to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "src/upload_database.py" ]; then
            python src/upload_database.py
          else
            python upload_database.py
          fi

      - name: Commit & Push Updated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_data/hasil_review_klinik_kita.xlsx
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada file Excel."
          else
            WIB_TIME=$(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M WIB')
            git commit -m "chore: manual update ulasan Klinik Kita (${WIB_TIME})"
            git push
          fi
