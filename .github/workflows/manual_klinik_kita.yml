name: Scrape Google Review Klinik Kita

on:
  schedule:
    # sadadasd
    # Jadwal otomatis setiap hari pukul 15:30 UTC = 22:30 WIB
    - cron: "30 15 * * *"
  workflow_dispatch:
    # Mengizinkan eksekusi manual dari tab Actions (bisa pilih branch devel/main)

jobs:
  scrape-and-upload:
    # Memastikan proses otomasi hanya berjalan dari branch main (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Google Maps Scraper
        env:
          GMAPS_URL: ${{ secrets.GMAPS_URL }}
        run: |
          python src/scrape_klinik_kita.py

      - name: Upload & Sync to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python src/upload_database.py
