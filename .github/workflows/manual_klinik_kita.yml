name: Manual Scrape & Upload Klinik Kita

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Google Reviews Scraper (with virtual display Xvfb)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python src/scrape_klinik_kita.py

      - name: Upload cleaned dataset to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python src/upload_database.py

      - name: Commit and push updated Excel file to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_data/hasil_review_klinik_kita.xlsx
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada file Excel."
          else
            git commit -m "chore: manual update ulasan Klinik Kita ($(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M WIB'))"
            git push
          fi
