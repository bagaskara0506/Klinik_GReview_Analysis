name: Scrape Google Review Klinik Kita

on:
  schedule:
    # Jadwal otomatis setiap hari pukul 15:30 UTC = 22:30 WIB (otomatis jalan di branch main)
    - cron: "30 15 * * *"
  workflow_dispatch:
    # Mengizinkan eksekusi manual dari tab Actions (bisa pilih branch main atau devel)

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    # Otomatis memilih Environment 'production' jika di main, atau 'devel' jika di branch lain
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'devel' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Google Maps Scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python src/scrape_klinik_kita.py

      - name: Upload & Sync to Neon PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "src/upload_database.py" ]; then
            python src/upload_database.py
          else
            python upload_database.py
          fi
